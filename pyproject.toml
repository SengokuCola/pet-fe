[project]
name = "pet-fe"
version = "1.0.0"
description = "麦麦钢管：MaiBot 桌宠掉落特效与可调钢管音效"
requires-python = ">=3.11"
dependencies = ["maibot-plugin-sdk>=2.20.0,<3", "pywebview>=6.2,<7; sys_platform == 'win32'"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "resvg-py==0.5.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
